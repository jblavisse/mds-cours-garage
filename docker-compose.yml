services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.7
    container_name: n8n-garage
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      - N8N_SECURE_COOKIE=false
    volumes:
      - ./.n8n-data:/home/node/.n8n